<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Inter+Tight:wght@800&family=IBM+Plex+Mono:wght@400;500&family=Gochi+Hand&display=block" rel="stylesheet">
<style>
:root{--fg:#fff;--dim:rgba(255,255,255,.78)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#111;overflow:hidden;color:var(--fg);font-family:'Inter',sans-serif}
.poster{position:relative;width:100%;height:100%;background:url(assets/hall.jpg) center/cover}
.shade{position:absolute;inset:0;background:
 linear-gradient(to bottom,rgba(0,0,0,.45) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,0) 42%,rgba(0,0,0,0) 56%,rgba(0,0,0,.4) 72%,rgba(0,0,0,.72) 100%)}
.l{position:absolute;left:100px;right:100px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.mark{font-family:'Inter Tight';font-weight:800;letter-spacing:-.045em}
.mark sup{font-size:.36em;font-weight:700;vertical-align:1.1em;margin-left:2px;letter-spacing:0}
.hand{font-family:'Gochi Hand',cursive;text-transform:uppercase;letter-spacing:.03em}
.mono{font-family:'IBM Plex Mono',monospace}

.title{top:230px;font-family:'Inter Tight';font-weight:800;font-size:104px;line-height:.93;letter-spacing:-.055em}
.invites{top:470px;display:flex;align-items:baseline;gap:18px}
.invites .mark{font-size:64px}
.invites .line{flex:1;border-bottom:4px solid #fff;transform:translateY(-8px)}
.quote{top:590px;font-size:30px;line-height:1.25;color:var(--dim)}

.date{top:1405px;font-size:44px;line-height:1.12;font-weight:500}
.venue{top:1530px;font-size:24px;line-height:1.4;color:var(--dim);font-weight:500}
.venue b{color:#fff;font-weight:700}
.partners{top:1650px;display:flex;align-items:center;gap:30px}
.partners .mark{font-size:34px}
.partners img{height:62px;display:block}
.partners i{width:2px;height:46px;background:rgba(255,255,255,.4)}
svg.layer{position:absolute;inset:0;pointer-events:none}
</style></head>
<body><div class="poster">
<div class="shade"></div>

<svg class="layer" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs><g id="reg" stroke="#fff" stroke-width="2" fill="none"><circle r="13"/><path d="M-26 0h52M0-26v52"/><circle r="4" fill="#fff" stroke="none"/></g></defs>
  <g opacity=".85">
    <use href="#reg" x="26" y="26"/><use href="#reg" x="1054" y="26"/>
    <use href="#reg" x="26" y="1894"/><use href="#reg" x="1054" y="1894"/>
  </g>
  <g stroke="#fff" stroke-width="2" opacity=".85"><path d="M512 26h56M540 0v26"/><path d="M512 1894h56M540 1894v26"/></g>
</svg>

<div class="l title">Kemang Circular<br>Community</div>
<div class="l invites"><span class="mark">invites</span><span class="line"></span></div>

<div class="l date mono">Saturday, 10 October 2026<br>14.00 – 16.00</div>
<div class="l venue"><b>Self Care Community Centre (SCCC)</b><br>Jl. Kemang Raya 8B, 9 Jakarta Selatan 12730</div>

<div class="l partners">
  <span class="mark">space_available<sup>®</sup></span><i></i>
  <img src="assets/partners.png" alt="Daur Baur Collective, Kick Your Butt, Kopinako">
</div>
</div></body></html>
