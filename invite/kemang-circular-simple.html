<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@800;900&family=Gochi+Hand&display=block" rel="stylesheet">
<style>
:root{--bg:#6d706c;--fg:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;color:var(--fg);font-family:'Inter',sans-serif}
.poster{position:relative;width:100%;height:100%;background:linear-gradient(180deg,#767975 0%,#646763 100%)}
.photo{position:absolute;left:-10px;top:330px;width:1100px;height:1100px;
 background:url(assets/bar.jpg) 58% 50%/auto 100% no-repeat;
 -webkit-mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%)}
.wash{position:absolute;inset:0;background:rgba(84,87,83,.38)}
.abs{position:absolute;left:0;right:0;text-align:center}
.mark{font-family:'Inter Tight';font-weight:800;letter-spacing:-.045em}
.mark sup{font-size:.36em;font-weight:700;vertical-align:1.1em;margin-left:2px;letter-spacing:0}
.hand{font-family:'Gochi Hand',cursive;text-transform:uppercase;letter-spacing:.06em}

.invites{top:520px;left:95px;right:95px;display:flex;align-items:baseline;gap:14px}
.invites .mark{font-size:54px}
.invites .word{font-size:33px}
.invites .line{flex:1;border-bottom:2px solid rgba(255,255,255,.9);transform:translateY(-6px)}
.title{top:650px;font-size:66px;line-height:1.15}
.at{top:880px;font-size:38px}
.venue{top:960px;font-family:'Inter Tight';font-weight:900;font-size:66px;line-height:.82;letter-spacing:-.06em}
.venue sup{font-size:.4em;vertical-align:1.1em;letter-spacing:-.02em}
.date{top:1225px;font-size:33px}
.icons{position:absolute;left:684px;top:1540px;height:150px}
.foot{position:absolute;bottom:150px;left:86px;right:86px;display:flex;justify-content:space-between;align-items:flex-end}
.addr{font-size:19px;line-height:1.3}
.foot .mark{font-size:36px}
svg.layer{position:absolute;inset:0;pointer-events:none}
</style></head>
<body><div class="poster">
<div class="photo"></div>
<div class="wash"></div>

<svg class="layer" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs><g id="reg" stroke="#fff" stroke-width="2" fill="none"><circle r="13"/><path d="M-26 0h52M0-26v52"/><circle r="4" fill="#fff" stroke="none"/></g></defs>
  <g opacity=".9">
    <use href="#reg" x="22" y="22"/><use href="#reg" x="1058" y="22"/>
    <use href="#reg" x="22" y="1898"/><use href="#reg" x="1058" y="1898"/>
  </g>
  <g stroke="#fff" stroke-width="2" opacity=".9"><path d="M514 22h52M540 0v22"/><path d="M514 1898h52M540 1898v22"/></g>
</svg>

<div class="abs invites"><span class="mark">space_available<sup>®</sup></span><span class="word">invites</span><span class="line"></span></div>
<div class="abs title hand">Kemang Circular<br>Community</div>
<div class="abs at">at</div>
<div class="abs venue">self care<br>community<br>centre<sup>tm</sup></div>
<div class="abs date">Saturday, 10 October 2026, 14.00 – 16.00</div>

<img class="icons" src="assets/icons.png" alt="">
<div class="foot">
  <div class="addr">Self Care Community Centre (SCCC)<br>Jl. Kemang Raya 8B, 9 Jakarta Selatan 12730</div>
  <div class="mark">space_available<sup>®</sup></div>
</div>
</div></body></html>
